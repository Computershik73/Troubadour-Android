// Верхний уровень сборки.
//
// Набор версий тот же, что у «Трубача», и по той же причине: minSdk 16
// закрывает дорогу современному AndroidX, а JDK 8 — новым AGP.
//
//   AGP 4.1.3    — последняя ветка, которой хватает build-tools 29.0.2+
//                  и которая работает на JDK 8
//   Gradle 6.8.3 — в пределах поддержки AGP 4.1
//   Kotlin 1.6.21 — совместим и с тем, и с другим
//
// Нижняя граница у iOS-оригинала — 5.1, то есть iPhone 4. Ровесник ему
// по годам — Android 4.1, и он же первый, где есть MediaCodec и TLS 1.2
// в провайдере. Отсюда minSdk 16.
buildscript {
    ext.kotlin_version = '1.6.21'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
