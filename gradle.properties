org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Собирать нужно именно JDK, а не JRE: в PATH у Windows обычно лежит
# javapath от Oracle — это JRE, и Gradle с ним не найдёт javac.
# Либо задайте JAVA_HOME, либо снимите комментарий со строки ниже.
#
# org.gradle.java.home=C:\\Program Files\\Java\\jdk1.8.0_202

# Интерфейс построен на системных классах (Activity, ListView, View) —
# ни appcompat, ни Compose здесь нет: разметка перенесена из iOS-версии
# кодом, а не XML, ровно как там. Флаг всё равно включён — его требует
# ExoPlayer.
android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official

# JDK, а не JRE: в PATH у Windows лежит javapath от Oracle — это JRE,
# и Gradle с ним не найдёт javac.
org.gradle.java.home=C:/Program Files/Java/jdk1.8.0_202
